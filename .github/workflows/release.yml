# Publishes a release: the page is built from the release's sources and must match the committed rl_atlas.html, the
# tests must pass, and the single file rl_atlas.html becomes the release's download, with the notes in
# docs/releases/<tag>.md. It runs when a version tag (v1.2.3) is pushed, or by hand (Actions → Release → Run workflow)
# with the version: an existing tag is published as it is, a new one is made on the commit the workflow runs on.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version to publish (for example v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the tag, if it exists
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then git checkout -q "refs/tags/$TAG"; fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build, and check the committed page is the build of its sources
        run: |
          python build.py
          git diff --stat --exit-code -- rl_atlas.html app/
      - name: Test
        run: node --test
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" rl_atlas.html --target "$SHA" --title "RL Atlas ${TAG#v}" --latest "$@"
