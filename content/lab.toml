[entropy-gems]
title = "The entropy bonus: two gems"
env = "two-gems"
racers = [
  { algorithm = "a2c", name = "no entropy bonus", beta = 0.0 },
  { algorithm = "a2c", name = "entropy bonus β = 0.1", beta = 0.1 },
]
units = 200
runs = 20
seed = 1
alpha = 2.0
alphaW = 0.3
workers = 4
n = 5
gamma = 0.95
maxSteps = 500
charts = ["return"]
film = [1, 20, 60, 200]
intro = "A small gem two steps away pays 0.3; a big one seven steps away pays 1. A learner that settles on the first thing that works never finds the big gem. The entropy bonus rewards the policy for staying uncertain, so it keeps wandering long enough to find the better way."
success = { metric = "return", min = 0.9, text = "end up going for the big gem" }

[trpo-cliff]
title = "TRPO: how big a trust region?"
env = "cliff"
racers = [
  { algorithm = "trpo", name = "δ = 0.01", delta = 0.01 },
  { algorithm = "trpo", name = "δ = 0.05", delta = 0.05 },
  { algorithm = "trpo", name = "δ = 0.2", delta = 0.2 },
]
units = 60
runs = 12
seed = 1
alphaW = 0.1
workers = 4
lambda = 0.9
gamma = 1.0
maxSteps = 1000
charts = ["steps", "kl"]
film = [1, 5, 20, 60]
intro = "After each round, TRPO takes the largest step that keeps the policy within a distance δ of the one that collected the experience, measured by the KL divergence. A small region learns steadily; a large one trusts each round's noisy estimates too far, and some runs walk into a corner they never leave."
success = { metric = "steps", max = 100, text = "end up reaching the goal in under 100 steps" }

[ppo-maze]
title = "PPO: ten passes over each batch, with and without the clip"
env = "dyna-maze"
racers = [
  { algorithm = "ppo", name = "PPO (clip ε = 0.2)", clip = 0.2 },
  { algorithm = "ppo", name = "the same passes, no clip", clip = 0.0 },
]
units = 40
runs = 12
seed = 1
alpha = 0.3
alphaW = 0.1
workers = 4
epochs = 10
lambda = 0.9
beta = 0.0
gamma = 0.95
maxSteps = 1000
charts = ["steps", "kl"]
film = [1, 5, 10, 40]
intro = "PPO squeezes each round's experience: ten passes over it instead of one. Without the clip, every pass pushes the lucky actions further and the policy overfits its batch. With it, an action stops being pushed once its probability has moved 20% from where it was when the batch was collected."
success = { metric = "steps", max = 100, text = "end up reaching the gem in under 100 steps" }

[gae-cliff]
title = "GAE: how far should advantages look?"
env = "cliff"
racers = [
  { algorithm = "trpo", name = "λ = 0: one step, then trust the critic", lambda = 0.0 },
  { algorithm = "trpo", name = "λ = 0.9", lambda = 0.9 },
  { algorithm = "trpo", name = "λ = 1: the whole episode", lambda = 1.0 },
]
units = 60
runs = 12
seed = 1
alphaW = 0.1
workers = 4
delta = 0.02
gamma = 1.0
maxSteps = 1000
charts = ["steps"]
film = [1, 5, 20, 60]
intro = "Each step's advantage is a weighted sum of the TD errors after it, with weights that fade by γλ per step. With λ = 0 it is the one-step TD error, steady but only as good as the critic; with λ = 1 it is the whole return minus the critic, honest but noisy. In between does best."
success = { metric = "steps", max = 100, text = "end up reaching the goal in under 100 steps" }

