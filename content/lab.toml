# Lab presets: a world, the algorithms that race on it, and their starting knobs. Entries link to one with [text](lab:<id>).
#
#   env        the world (lab/envs): cliff, gridworld, small-gridworld, frozen-lake, dyna-maze, blocking-maze,
#              shortcut-maze, testbed, testbed-4, drifting, random-walk, random-walk-19, blackjack, max-bias,
#              walk-1000, mountain-car, baird, or sandbox (the map you draw)
#   algorithms the algorithms that race, with the shared knobs; or racers = [{ algorithm, name, <knobs of its own> }],
#              or racers = [{ recording }] for a run trained offline (content/recordings/), played back
#   units      how many episodes, sweeps or steps a run lasts; seed: its randomness
#   runs       > 1: the charts average that many runs, each with its own seed
#   charts     what to plot: return, optimal, left, error, match, greedy, delta, steps, ve, weights
#   measures   numbers computed against the exact answer after each unit: error, match, greedy, optimal-error, ve
#   film       the moments the filmstrip shows (in units)
#   success    what counts as a run that ended well, for the odds the Lab counts over many seeds: { metric, min or
#              max, window = [first, last] units (the last tenth by default), text }; text finishes "how many …"
#   sweep      the values the Lab's sweep tries for a knob, where the defaults do not suit the world: { q0 = [...] }
# Any other key is a knob every algorithm gets: alpha, epsilon, gamma, q0, c, theta, policy, baseline, v0, sync, judge,
# n (n-step methods), lambda and trace ("accumulating" or "replacing"), planning and kappa (Dyna),
# features ("groups", "tiles", "poly", "fourier", "table" or "own") with cells, tilings and order, and behavior (the
# policy an off-policy method follows; policy is then the one it learns about).

[cliff-race]
title = "SARSA vs Q-learning on the cliff"
env = "cliff"
algorithms = ["sarsa", "q-learning"]
units = 500
seed = 7
alpha = 0.5
epsilon = 0.1
gamma = 1.0
domain = [-100, 0]
charts = ["return"]
film = [1, 10, 100, 500]
intro = "Same world, same randomness, one change in the update. Watch which path each one learns, and which one falls more often while learning."
success = { metric = "return", min = -40, text = "end up losing less than 40 per episode on average, while still exploring" }

[cliff-expected]
title = "Expected SARSA on the cliff"
env = "cliff"
algorithms = ["sarsa", "expected-sarsa", "q-learning"]
units = 500
seed = 7
alpha = 0.5
epsilon = 0.1
gamma = 1.0
domain = [-100, 0]
charts = ["return"]
film = [1, 10, 100, 500]
intro = "Expected SARSA averages over the next moves instead of sampling one. It learns a path between SARSA's and Q-learning's, and its rewards wobble less from episode to episode."
success = { metric = "return", min = -40, text = "end up losing less than 40 per episode on average, while still exploring" }

[bandit-epsilon]
title = "Greedy vs ε-greedy"
env = "testbed"
racers = [
  { algorithm = "epsilon-greedy", name = "greedy (ε = 0)", epsilon = 0.0 },
  { algorithm = "epsilon-greedy", name = "ε = 0.01", epsilon = 0.01 },
  { algorithm = "epsilon-greedy", name = "ε = 0.1", epsilon = 0.1 },
]
units = 1000
runs = 500
seed = 1
alpha = 0.0
charts = ["return", "optimal"]
film = [10, 100, 1000]
intro = "Ten slot machines with hidden payouts. The greedy learner settles on the first arm that looks good; a little exploration finds the best one. The charts average many runs, each on new machines."
success = { metric = "optimal", min = 0.5, text = "end up pulling the best arm most of the time" }

[bandit-optimistic]
title = "Optimistic starts vs ε-greedy"
env = "testbed"
racers = [
  { algorithm = "optimistic-init", name = "optimistic, greedy (Q₁ = 5)", q0 = 5.0, epsilon = 0.0 },
  { algorithm = "epsilon-greedy", name = "realistic, ε = 0.1 (Q₁ = 0)", q0 = 0.0, epsilon = 0.1 },
]
units = 1000
runs = 500
seed = 1
alpha = 0.1
charts = ["optimal", "return"]
film = [10, 100, 1000]
intro = "Starting every estimate far too high makes even a greedy learner try every arm: each pull disappoints, so it moves on. Watch the spike in the first steps."
success = { metric = "optimal", min = 0.5, text = "end up pulling the best arm most of the time" }

[bandit-ucb]
title = "UCB vs ε-greedy"
env = "testbed"
racers = [
  { algorithm = "ucb", name = "UCB (c = 2)" },
  { algorithm = "epsilon-greedy", name = "ε-greedy (ε = 0.1)", epsilon = 0.1 },
]
units = 1000
runs = 500
seed = 1
alpha = 0.0
c = 2.0
charts = ["return", "optimal"]
film = [10, 100, 1000]
intro = "UCB explores where it is unsure: each arm gets a bonus that shrinks the more it is tried. ε-greedy explores blindly, at the same rate forever."
success = { metric = "optimal", min = 0.5, text = "end up pulling the best arm most of the time" }

[bandit-gradient]
title = "Gradient bandit, with and without a baseline"
env = "testbed-4"
racers = [
  { algorithm = "gradient-bandit", name = "with baseline", baseline = true },
  { algorithm = "gradient-bandit", name = "without baseline", baseline = false },
]
units = 1000
runs = 500
seed = 1
alpha = 0.1
charts = ["optimal"]
film = [10, 100, 1000]
intro = "Every payout here is around +4. Without a baseline every reward looks good and pushes up whatever was pulled; with the average reward as a baseline only better-than-usual rewards do."
success = { metric = "optimal", min = 0.5, text = "end up pulling the best arm most of the time" }

[bandit-drift]
title = "Sample averages vs a constant step size on drifting machines"
env = "drifting"
racers = [
  { algorithm = "epsilon-greedy", name = "sample averages (α = 1/n)", alpha = 0.0 },
  { algorithm = "epsilon-greedy", name = "constant α = 0.1", alpha = 0.1 },
]
units = 10000
runs = 200
seed = 1
epsilon = 0.1
charts = ["return", "optimal"]
film = [100, 1000, 10000]
intro = "The machines slowly change their payouts. Averages weigh a pull from long ago as much as the last one and fall behind; a constant step size keeps up."
success = { metric = "optimal", min = 0.5, text = "end up pulling the current best arm most of the time" }

[dp-evaluation]
title = "Policy evaluation, sweep by sweep"
env = "small-gridworld"
algorithms = ["policy-evaluation"]
units = 200
seed = 1
gamma = 1.0
theta = 0.001
policy = "random"
charts = ["delta"]
film = [0, 1, 2, 3, 10, 200]
intro = "Every move costs 1 until a shaded corner is reached, and the policy moves at random. Each sweep replaces every value by the average over its four moves of the reward plus the value of where the move lands."

[dp-iteration]
title = "Policy iteration vs value iteration on Frozen Lake"
env = "frozen-lake"
algorithms = ["policy-iteration", "value-iteration"]
units = 120
seed = 1
gamma = 0.99
theta = 0.001
charts = ["optimal-error", "delta"]
measures = ["optimal-error"]
film = [0, 1, 5, 20, 120]
intro = "Both know the rules of the slippery lake. Policy iteration evaluates a policy until its values settle, then improves it; value iteration improves at every sweep."

[blackjack-prediction]
title = "Monte Carlo prediction at Blackjack"
env = "blackjack"
algorithms = ["mc-prediction"]
units = 100000
seed = 1
gamma = 1.0
policy = "stick-20"
charts = ["error"]
measures = ["error"]
film = [100, 1000, 10000, 100000]
intro = "The player sticks only on 20 or 21. After every hand, each state it passed through moves toward the hand's result. The error is measured against the exact values, computed from the rules."

[blackjack-control]
title = "Learning to play Blackjack"
env = "blackjack"
racers = [
  { algorithm = "exploring-starts", name = "Monte Carlo ES" },
  { algorithm = "off-policy-mc", name = "off-policy MC, from random play", epsilon = 1.0 },
]
units = 100000
seed = 1
gamma = 1.0
charts = ["match"]
measures = ["match"]
film = [100, 1000, 10000, 100000]
intro = "Exploring starts deals random states and plays its own best guess. Off-policy MC only watches a player who chooses at random, and still learns the best strategy."

[frozen-mc]
title = "Monte Carlo control vs Q-learning on Frozen Lake"
env = "frozen-lake"
racers = [
  { algorithm = "mc-control", name = "on-policy MC (averages)", alpha = 0.0 },
  { algorithm = "q-learning", name = "Q-learning (α = 0.1)", alpha = 0.1 },
]
units = 3000
seed = 30
gamma = 0.99
epsilon = 0.1
judge = 1.0
charts = ["greedy"]
measures = ["greedy"]
film = [10, 100, 1000, 3000]
intro = "Only the gem pays, and the ice is slippery. Monte Carlo learns from whole episodes and gets going quickly; Q-learning passes the news back one step at a time."
success = { metric = "greedy", min = 0.5, text = "end with a greedy policy that reaches the gem at least half the time" }

[random-walk]
title = "TD(0) vs Monte Carlo on the random walk"
env = "random-walk"
algorithms = ["td0", "mc-prediction"]
units = 100
runs = 100
seed = 1
alpha = 0.1
gamma = 1.0
v0 = 0.5
charts = ["error"]
measures = ["error"]
film = [0, 1, 10, 100]
intro = "Five states between two exits; only the right exit pays +1. Walking at random, the true values are 1/6 to 5/6. Both start at 0.5 and learn from the same walks."

[max-bias]
title = "Q-learning vs Double Q-learning"
env = "max-bias"
algorithms = ["q-learning", "double-q"]
units = 300
runs = 1000
seed = 1
alpha = 0.1
epsilon = 0.1
gamma = 1.0
charts = ["left"]
intro = "Going left from A leads to B, whose many actions all lose a little on average, but some will look like winners by luck. Q-learning trusts the luckiest one; Double Q-learning does not."
success = { metric = "left", max = 0.1, window = [41, 60], text = "go left from A at most 10% of the time by episodes 41 to 60" }

[n-step-walk]
title = "n-step TD on the 19-state random walk"
env = "random-walk-19"
racers = [
  { algorithm = "n-step-td", name = "n = 1 (TD(0))", n = 1 },
  { algorithm = "n-step-td", name = "n = 4", n = 4 },
  { algorithm = "n-step-td", name = "n = 32", n = 32 },
]
units = 20
runs = 100
seed = 1
alpha = 0.4
gamma = 1.0
charts = ["error"]
measures = ["error"]
film = [0, 1, 5, 20]
intro = "Nineteen states between an exit that pays −1 and one that pays +1. One-step TD passes the news back one state per walk; a long n waits for many real rewards and inherits their noise. In between learns fastest at first; later, with this step size, the steadier one-step targets catch up."

[n-step-sarsa]
title = "n-step SARSA in the maze"
env = "dyna-maze"
racers = [
  { algorithm = "n-step-sarsa", name = "n = 1 (SARSA)", n = 1 },
  { algorithm = "n-step-sarsa", name = "n = 4", n = 4 },
  { algorithm = "n-step-sarsa", name = "n = 16", n = 16 },
]
units = 50
runs = 30
seed = 1
alpha = 0.1
epsilon = 0.1
gamma = 0.95
charts = ["steps"]
film = [1, 2, 5, 50]
intro = "Only the gem pays. When the first episode finally reaches it, one-step SARSA strengthens one move, the last; n-step SARSA strengthens the last n moves at once, so the way home is found in fewer episodes."
success = { metric = "steps", max = 150, window = [3, 4], text = "already reach the gem in under 150 steps in episodes 3 and 4" }

[td-lambda-walk]
title = "TD(λ) on the 19-state random walk"
env = "random-walk-19"
racers = [
  { algorithm = "td-lambda", name = "λ = 0 (TD(0))", lambda = 0.0 },
  { algorithm = "td-lambda", name = "λ = 0.6", lambda = 0.6 },
  { algorithm = "td-lambda", name = "λ = 0.9", lambda = 0.9 },
]
units = 20
runs = 100
seed = 1
alpha = 0.2
gamma = 1.0
charts = ["error"]
measures = ["error"]
film = [0, 1, 5, 20]
intro = "Every state the walk passes leaves a glowing trace that fades with each step. Each surprise is shared by all the glowing states at once, the brightest getting the most. With λ = 0 the trace vanishes at once, and TD(λ) is TD(0)."

[sarsa-lambda]
title = "SARSA(λ) in the maze"
env = "dyna-maze"
racers = [
  { algorithm = "sarsa-lambda", name = "λ = 0 (SARSA)", lambda = 0.0 },
  { algorithm = "sarsa-lambda", name = "λ = 0.9, accumulating", lambda = 0.9 },
  { algorithm = "sarsa-lambda", name = "λ = 0.9, replacing", lambda = 0.9, trace = "replacing" },
]
units = 50
runs = 30
seed = 1
alpha = 0.1
epsilon = 0.1
gamma = 0.95
charts = ["steps"]
film = [1, 2, 5, 50]
intro = "The trace marks every move of the episode, fading with time. When the gem is reached, the whole glowing trail learns at once. Accumulating traces grow on moves made again and again, replacing traces stop at 1."
success = { metric = "steps", max = 60, window = [3, 4], text = "already reach the gem in under 60 steps in episodes 3 and 4" }

[dyna-maze]
title = "Dyna-Q: planning in the maze"
env = "dyna-maze"
racers = [
  { algorithm = "dyna-q", name = "no planning (Q-learning)", planning = 0 },
  { algorithm = "dyna-q", name = "5 planning steps", planning = 5 },
  { algorithm = "dyna-q", name = "50 planning steps", planning = 50 },
]
units = 50
runs = 30
seed = 1
alpha = 0.1
epsilon = 0.1
gamma = 0.95
charts = ["steps"]
film = [1, 2, 3, 50]
intro = "After every real step, Dyna-Q replays remembered moves to itself: the dashed sparks. The first episode is a long random search for all three; after it, the planners find the way home almost at once."
success = { metric = "steps", max = 40, window = [3, 4], text = "already reach the gem in under 40 steps in episodes 3 and 4" }

[dyna-blocking]
title = "Dyna-Q vs Dyna-Q+ when the way is blocked"
env = "blocking-maze"
racers = [
  { algorithm = "dyna-q", name = "Dyna-Q" },
  { algorithm = "dyna-q-plus", name = "Dyna-Q+ (κ = 0.001)" },
]
units = 200
seed = 1
alpha = 1.0
epsilon = 0.1
gamma = 0.95
planning = 10
kappa = 0.001
charts = ["steps"]
film = [10, 60, 100, 200]
intro = "After 1000 steps the gap in the wall moves from the right end to the left. Both agents bump into the new wall; the way through is a move neither has ever made. Dyna-Q+ gives a bonus to moves it has not tried in a while, so it goes and finds the new gap much sooner."

[dyna-shortcut]
title = "Dyna-Q vs Dyna-Q+ when a shortcut opens"
env = "shortcut-maze"
racers = [
  { algorithm = "dyna-q", name = "Dyna-Q" },
  { algorithm = "dyna-q-plus", name = "Dyna-Q+ (κ = 0.001)" },
]
units = 400
seed = 1
alpha = 1.0
epsilon = 0.1
gamma = 0.95
planning = 50
kappa = 0.001
charts = ["steps"]
film = [50, 150, 250, 400]
intro = "After 3000 steps a shortcut opens on the right. Nothing tells Dyna-Q: its model and its plans say the long way is best, and it never looks. Dyna-Q+'s curiosity bonus sends it to check, and it finds the shorter path."
success = { metric = "steps", max = 15, text = "end up taking the shortcut (under 15 steps)" }

[sweeping]
title = "Prioritized sweeping vs Dyna-Q"
env = "dyna-maze"
racers = [
  { algorithm = "dyna-q", name = "Dyna-Q, random order" },
  { algorithm = "prioritized-sweeping", name = "prioritized sweeping" },
]
units = 30
runs = 30
seed = 1
alpha = 0.5
epsilon = 0.1
gamma = 0.95
planning = 5
charts = ["steps"]
film = [1, 2, 5, 30]
intro = "Both may make 5 planning updates per step. Dyna-Q picks remembered moves at random, mostly ones where nothing changes; prioritized sweeping works backward from wherever a value just changed, so the news spreads from the gem along the way it came. It pays off right after the first success: watch episodes 2 and 3."
success = { metric = "steps", max = 60, window = [2, 3], text = "already reach the gem in under 60 steps in episodes 2 and 3" }

[walk-aggregation]
title = "Gradient Monte Carlo and semi-gradient TD on 1000 states"
env = "walk-1000"
racers = [
  { algorithm = "gradient-mc", name = "Gradient Monte Carlo", alpha = 0.0005 },
  { algorithm = "semi-gradient-td", name = "Semi-gradient TD(0)", alpha = 0.002 },
]
units = 2000
seed = 3
gamma = 1.0
features = "groups"
cells = 10
charts = ["ve"]
measures = ["ve"]
film = [0, 10, 100, 500, 2000]
intro = "A thousand states, ten weights: each weight is shared by a group of 100 states. Every update moves a whole group, the box in the strip under the plot. Monte Carlo settles on each group's average true value; TD settles on something flatter."

[walk-features]
title = "Four ways to describe 1000 states"
env = "walk-1000"
racers = [
  { algorithm = "gradient-mc", name = "5 groups", features = "groups", cells = 5, alpha = 0.0005 },
  { algorithm = "gradient-mc", name = "Tile coding, 50 tilings", features = "tiles", tilings = 50, cells = 5, alpha = 0.00001 },
  { algorithm = "gradient-mc", name = "Polynomials up to x⁵", features = "poly", order = 5, alpha = 0.0002 },
  { algorithm = "gradient-mc", name = "Fourier cosines up to 5", features = "fourier", order = 5, alpha = 0.0001 },
]
units = 2000
seed = 2
gamma = 1.0
charts = ["ve"]
measures = ["ve"]
film = [0, 10, 100, 2000]
intro = "Same learner, same walks, four sets of features. Watch the footprint strip: a box for groups, a tent for tile coding, waves across all states for polynomials and cosines. What an update touches is what the learner generalizes to."

[mountain-car]
title = "Semi-gradient SARSA climbs Mountain Car"
env = "mountain-car"
algorithms = ["semi-gradient-sarsa"]
units = 500
seed = 1
alpha = 0.06
epsilon = 0.0
gamma = 1.0
features = "tiles"
tilings = 8
cells = 8
charts = ["steps"]
film = [1, 12, 100, 500]
intro = "Every step costs 1, and the engine is too weak to drive straight up. The landscape on the right is what the learner expects to pay from each position and speed: it starts flat and hopeful (all estimates 0), and every disappointment digs in, until the car learns to rock back first."
success = { metric = "steps", max = 150, text = "end up getting out in under 150 steps" }

[mountain-car-n]
title = "One step or eight on Mountain Car"
env = "mountain-car"
racers = [
  { algorithm = "semi-gradient-sarsa", name = "n = 1", n = 1, alpha = 0.06 },
  { algorithm = "semi-gradient-sarsa", name = "n = 8", n = 8, alpha = 0.04 },
]
units = 300
runs = 20
seed = 1
epsilon = 0.0
gamma = 1.0
features = "tiles"
tilings = 8
cells = 8
charts = ["steps"]
film = [1, 10, 100, 300]
intro = "The n-step return reaches eight steps ahead, so each disappointment travels back faster: the landscape fills in sooner, and the first episodes are shorter."
success = { metric = "steps", max = 300, window = [1, 30], text = "average under 300 steps over the first 30 episodes" }


[mountain-car-optimism]
title = "Mountain Car: where the values start"
env = "mountain-car"
racers = [
  { algorithm = "semi-gradient-sarsa", name = "values start at 0", q0 = 0.0 },
  { algorithm = "semi-gradient-sarsa", name = "values start at −150", q0 = -150.0 },
]
units = 200
seed = 1
alpha = 0.06
epsilon = 0.1
gamma = 0.99
maxSteps = 1000
features = "tiles"
tilings = 8
cells = 8
charts = ["steps"]
film = [1, 10, 50, 200]
intro = "Both take a random move 10% of the time and discount by γ = 0.99, so paying 1 forever is worth −100: no real value is lower. Only the start differs. At 0 the values are above every real one: each move the car tries disappoints, the untried ones get their turn, and it rocks its way out. At −150 they are below every real one: each move it tries looks better than before, so it keeps repeating them, and random moves alone almost never build the swing the hill needs. Sweep q0: the line is −100."
sweep = { q0 = [-300.0, -200.0, -150.0, -120.0, -100.0, -80.0, -50.0, 0.0] }
success = { metric = "steps", max = 300, text = "end up getting out in under 300 steps" }
[deadly-triad]
title = "The deadly triad on Baird's counterexample"
env = "baird"
racers = [
  { algorithm = "semi-gradient-td", name = "All three: off-policy, shared features, bootstrapping", features = "own", behavior = "behavior" },
  { algorithm = "semi-gradient-td", name = "A table instead of shared features", features = "table", behavior = "behavior" },
  { algorithm = "semi-gradient-td", name = "On-policy instead of off-policy", features = "own" },
]
units = 1000
seed = 1
alpha = 0.01
gamma = 0.99
policy = "target"
charts = ["weights", "error"]
measures = ["error"]
film = [0, 100, 300, 1000]
intro = "Every true value is 0, and nothing random can mislead the learner: rewards are always 0. Yet off-policy semi-gradient TD with these features walks its weights away to infinity. Take away any one of the three ingredients and the weights stay bounded: with a table they drift up for a few thousand steps, then come back down."
success = { metric = "weights", max = 100, text = "keep the size of their weights under 100" }

[sandbox]
title = "Sandbox"
env = "sandbox"
algorithms = ["q-learning"]
units = 500
seed = 1
alpha = 0.5
epsilon = 0.1
gamma = 1.0
charts = ["return"]
film = [1, 10, 100, 500]
intro = "Draw a world of your own, choose an algorithm, and watch it learn. Every change runs it again."

[corridor-reinforce]
title = "REINFORCE on the short corridor"
env = "corridor"
racers = [
  { algorithm = "reinforce", name = "α = 2⁻¹²", alpha = 0.000244140625 },
  { algorithm = "reinforce", name = "α = 2⁻¹³", alpha = 0.0001220703125 },
  { algorithm = "reinforce", name = "α = 2⁻¹⁴", alpha = 0.00006103515625 },
]
units = 1000
runs = 100
seed = 1
gamma = 1.0
features = "own"
maxSteps = 1000
charts = ["return", "right"]
measures = ["right"]
film = [0, 50, 200, 1000]
intro = "Every cell looks the same to the agent, and the middle one swaps left and right. No fixed choice ever reaches the goal; the best is to step right about 59% of the time. REINFORCE starts at 5% and climbs the landscape below the corridor, one episode at a time. The biggest step size is the fastest, until a run is thrown off the landscape."
success = { metric = "return", min = -50, text = "end up reaching the goal in under 50 steps on average" }

[corridor-baseline]
title = "REINFORCE with and without a baseline"
env = "corridor"
racers = [
  { algorithm = "reinforce", name = "REINFORCE (α = 2⁻¹³)", alpha = 0.0001220703125 },
  { algorithm = "baseline", name = "with a baseline (α = 2⁻⁹, αw = 2⁻⁶)", alpha = 0.001953125, alphaW = 0.015625 },
]
units = 1000
runs = 100
seed = 1
gamma = 1.0
features = "own"
maxSteps = 1000
charts = ["return", "right"]
measures = ["right"]
film = [0, 50, 200, 1000]
intro = "Every return here is negative, so without a baseline every action taken is made less likely, the good ones only a little less. Subtracting a learned estimate of the return leaves the direction of each update the same on average, and removes most of its noise: the step size can be sixteen times larger."
success = { metric = "return", min = -50, text = "end up reaching the goal in under 50 steps on average" }

[throw]
title = "A Gaussian policy learns to throw"
env = "throw"
racers = [
  { algorithm = "baseline", name = "with a learned baseline (α = 0.003)", alpha = 0.003, alphaW = 0.1 },
  { algorithm = "reinforce", name = "without a baseline (α = 0.0003)", alpha = 0.0003 },
]
units = 1000
seed = 1
gamma = 1.0
features = "own"
charts = ["return", "aim"]
measures = ["aim"]
film = [0, 50, 200, 1000]
intro = "The action is an angle, a real number: the policy is a bell curve around its aim. Each throw is drawn from the bell; a throw that flies farther than expected pulls the aim toward its angle, and the bell narrows as the policy grows sure. The best angle is 45°, but the learner is never told."
success = { metric = "return", min = 39, text = "end up throwing 39 or farther on average, close to the longest throw" }

[cliff-actor-critic]
title = "Actor–critic on the cliff"
env = "cliff"
algorithms = ["actor-critic"]
units = 500
seed = 1
alpha = 0.1
alphaW = 0.1
lambda = 0.0
gamma = 1.0
domain = [-100, 0]
charts = ["return", "policy-value"]
measures = ["policy-value"]
film = [1, 10, 100, 500]
intro = "The critic colors the tiles with what it expects from each; the actor's arrows are its policy, thicker for likelier moves. After every step, the critic's surprise δ judges the move just made: better than expected, it becomes likelier. Like SARSA, it learns from its own wandering, and the edge of the cliff costs it dearly."
success = { metric = "return", min = -30, text = "end up reaching the goal in under 30 steps without falling" }

[a2c-maze]
title = "A2C: four workers in the maze"
env = "dyna-maze"
racers = [
