# The symbols page: what each color means, and the notation used everywhere.
# Formulas use the color macros of app/js/math.js: \val \rew \pol \err, and \alp \gam \eps \lam \del.

[[quantity]]
key = "val"
name = "Value"
tex = '\val{V(s)},\ \val{Q(s,a)}'
text = "How good a state, or a move in a state, is: the reward you can expect from there on."

[[quantity]]
key = "rew"
name = "Reward and return"
tex = '\rew{R},\ \rew{G}'
text = "What the world pays after each move, and the discounted sum of those payments."

[[quantity]]
key = "pol"
name = "Policy"
tex = '\pol{\pi(a \mid s)}'
text = "How the agent chooses: a probability for each move in each state."

[[quantity]]
key = "err"
name = "Surprise"
tex = '\err{\delta},\ \err{A}'
text = "How much better or worse things went than expected: the TD error and the advantage."

[[quantity]]
key = "knob"
name = "Knobs"
tex = '\alp,\ \gam,\ \eps,\ \lam'
text = "Settings you choose: step size, discount, exploration rate and trace decay. They stay in ink."

[[symbol]]
tex = 'S,\ S_t'
text = "the state the agent is in (at time step t)"
station = "state-action-reward"

[[symbol]]
tex = 'A,\ A_t'
text = "the action (move) the agent takes"
station = "state-action-reward"

[[symbol]]
tex = '\rew{R},\ \rew{R_{t+1}}'
text = "the reward that follows the action"
station = "state-action-reward"

[[symbol]]
tex = "S',\\ A'"
text = "the next state and the next action"
station = "state-action-reward"

[[symbol]]
tex = '\rew{G_t}'
text = "the return: the discounted sum of rewards from time t on"
station = "return"

[[symbol]]
tex = '\pol{\pi}'
text = "the policy"
station = "policy"

[[symbol]]
tex = '\val{V(s)}'
text = "the value of state s: the return expected from s"
station = "value-functions"

[[symbol]]
tex = '\val{Q(s,a)}'
text = "the value of taking action a in state s"
station = "value-functions"

[[symbol]]
tex = '\max_a'
text = "the largest value over all actions a"
station = "optimality"

[[symbol]]
tex = '\del'
text = "the TD error: target minus current estimate"
station = "td-error"

[[symbol]]
tex = '\alp'
text = "step size: how far each update moves the estimate"
station = "step-size"

[[symbol]]
tex = '\gam'
text = "discount factor: how much later rewards count"
station = "discount"

[[symbol]]
tex = '\eps'
text = "exploration rate of ε-greedy"
station = "epsilon-greedy"

[[symbol]]
tex = '\lam'
text = "trace decay: how far back credit flows"
station = "lambda-return"

[[symbol]]
tex = '\theta,\ \mathbf{w}'
text = "the weights of a policy or of a value function"
station = "features"

[[symbol]]
tex = '\mathbf{x}(s)'
text = "the feature vector of state s: a few numbers that describe it"
station = "features"

[[symbol]]
tex = '\val{\hat v(s, \mathbf w)},\ \val{\hat q(s, a, \mathbf w)}'
text = "estimated values computed from weights, instead of read from a table"
station = "why-approximate"

[[symbol]]
tex = '\mu(s)'
text = "the share of its time the agent spends in state s"
station = "value-error"

[[symbol]]
tex = '\overline{\text{VE}}(\mathbf w)'
text = "the value error: squared errors weighted by μ"
station = "value-error"

[[symbol]]
tex = '\mathbb{E}'
text = "expected value: the average over all the randomness"
station = "value-functions"

[[symbol]]
tex = '\mathbf w^-'
text = "the target network's weights: a copy of the network's weights w, refreshed every C steps, used only to compute targets"
station = "target-network"

[[symbol]]
tex = '\mathcal D,\ N,\ B'
text = "the replay memory, the number of transitions it keeps, and the size of each minibatch drawn from it"
station = "experience-replay"

[[symbol]]
tex = '\mathbf h_\ell = \varphi(W_\ell \mathbf h_{\ell-1} + \mathbf b_\ell)'
text = "a network's layer ℓ: weights W, biases b and a nonlinearity φ (the rectifier max(0, z), or tanh)"
station = "neural-networks"

[[symbol]]
tex = '\val{\hat v(s)},\ \err{\hat a(s, a)}'
text = "a dueling network's two streams: how good the state is, and how much each action adds to it"
station = "dqn-extensions"

[[symbol]]
tex = 'p_i,\ \alpha,\ \beta'
text = "prioritized replay: transition i's priority (its last TD error, plus a little), how strongly priorities skew the sampling, and how fully importance weights correct for it (an ink α and β, not the step size or the entropy weight)"
station = "dqn-extensions"

[[symbol]]
tex = '\pol{\pi(a \mid s, \boldsymbol\theta)}'
text = "a policy with weights of its own: the probability of action a in state s"
station = "why-policy"

[[symbol]]
tex = 'J(\boldsymbol\theta)'
text = "the performance of the policy: the value of the start, or the average reward per step"
station = "pg-theorem"

[[symbol]]
tex = '\nabla \ln \pol{\pi(A \mid S, \boldsymbol\theta)}'
text = "the score: the direction that makes action A in S more likely, divided by its probability"
station = "policy-parameterization"

[[symbol]]
tex = '\pol{h(s, a, \boldsymbol\theta)}'
text = "the preference for action a in state s; a softmax turns preferences into probabilities"
station = "policy-parameterization"

[[symbol]]
tex = '\pol{\mu(s)},\ \pol{\sigma(s)}'
text = "the mean and the spread of a Gaussian policy over a real-valued action (not the state distribution μ)"
station = "policy-parameterization"

[[symbol]]
tex = '\err{a_\pi(s, a)},\ \err{\hat A_t}'
text = "the advantage, how much better action a is than the policy's average in s, and its estimate"
station = "pg-theorem"

[[symbol]]
tex = '\alp^{\boldsymbol\theta},\ \alp^{\mathbf w}'
text = "the step sizes of the actor (the policy) and of the critic (the values)"
station = "actor-critic"

[[symbol]]
tex = '\pol{H\big(\pi(\cdot \mid s)\big)},\ \beta'
text = "the entropy of the policy in state s, how undecided it is, and the weight of the entropy bonus"
station = "entropy-bonus"

[[symbol]]
tex = 'D_{\mathrm{KL}}\big(\pol{\pi} \,\|\, \pol{\pi^\prime}\big),\ \delta'
text = "the KL divergence, how differently two policies choose, and TRPO's bound on it (an ink δ, not the TD error)"
station = "trpo"

[[symbol]]
tex = 'r_t(\boldsymbol\theta),\ \epsilon'
text = "the probability ratio of a sampled action under the new and the old policy, and PPO's clip range 1 ± ε"
station = "ppo"

[[symbol]]
tex = '\pol{\mu(s, \boldsymbol\theta)}'
text = "a deterministic policy: the one action it takes in state s, a point in a continuous range"
station = "dpg"

[[symbol]]
tex = '\nabla_a \val{\hat q(s, a)}'
text = "the critic's slope in action space: which way, and how steeply, a change of action raises the value; the deterministic actor follows it"
station = "dpg"

[[symbol]]
tex = '\boldsymbol\theta^-,\ \tau'
text = "the target actor's weights, and how far target copies move toward their networks at every step (a soft update; DDPG, TD3, SAC)"
station = "ddpg"

[[symbol]]
tex = '\min_{i} \val{\hat q_i},\ \tilde\sigma,\ c,\ d'
text = "TD3: the smaller of two critics, the spread of the noise on the target action and its clip, and how many critic steps pass between actor steps"
station = "td3"

[[symbol]]
tex = '\alpha,\ \mathcal H,\ \bar{\mathcal H}'
text = "SAC: the entropy weight (an ink α, not the step size), the policy's entropy, and the target entropy α is tuned toward"
station = "sac"
