# The unified view: every station of the atlas in one table. Across, the families of methods (the tabular methods
# split into those that learn from experience and those that use a model); down, how far an update looks ahead,
# after Sutton & Barto (§8.13). A family's ideas sit at the top of its column. Rows named in `bands` hold a whole
# line, spread across the table: the problem above everything, the toolbox and what comes next below.
# Within a cell, stations keep their reading order. A cell's columns are "a" or "a-b" (a span).
[unified]
columns = [
  { id = "free", title = "from experience", line = "tabular" },
  { id = "model", title = "with a model", line = "tabular" },
  { id = "approx", title = "Function approximation", line = "approximation" },
  { id = "pg", title = "Policy gradients", line = "policy" },
  { id = "cont", title = "Continuous control", line = "continuous" },
]
rows = [
  { id = "problem", title = "The problem", note = "every method starts here", band = "foundations" },
  { id = "ideas", title = "The ideas", note = "what each family is built on" },
  { id = "bandit", title = "No next state", note = "bandits: the reward is all" },
  { id = "one", title = "One step", note = "a reward, then a guess" },
  { id = "n", title = "n steps", note = "n rewards, then a guess" },
  { id = "blend", title = "Every depth", note = "a blend: traces, λ and GAE" },
  { id = "full", title = "The whole episode", note = "the full return, no guess" },
  { id = "toolbox", title = "Toolbox", note = "for every method", band = "toolbox" },
  { id = "next", title = "Where next", note = "beyond this atlas", band = "next" },
]

[unified.cells]
ideas = [
  { at = "free", stations = ["mc-vs-td"] },
  { at = "model", stations = ["policy-improvement", "gpi", "dp-limits", "models"] },
  { at = "approx", stations = ["why-approximate", "features", "value-error", "generalization", "deadly-triad", "neural-networks"] },
  { at = "pg", stations = ["why-policy", "policy-parameterization", "pg-theorem", "entropy-bonus"] },
  { at = "cont", stations = ["action-noise", "parameter-noise", "gsde", "policy-spread", "smooth-policies", "critic-regularization", "robust-policies", "control-recipe"] },
]
bandit = [
  { at = "free-model", stations = ["k-armed-bandit", "incremental-mean", "step-size", "epsilon-greedy", "optimistic-init", "ucb", "gradient-bandit", "nonstationary"] },
]
one = [
  { at = "free", stations = ["td0", "td-error", "bootstrapping", "sarsa", "q-learning", "expected-sarsa", "double-q"] },
  { at = "model", stations = ["policy-evaluation", "policy-iteration", "value-iteration", "dyna-q", "dyna-q-plus", "prioritized-sweeping"] },
  { at = "approx", stations = ["semi-gradient-td", "semi-gradient-sarsa", "dqn", "experience-replay", "target-network", "dqn-extensions"] },
  { at = "pg", stations = ["actor-critic"] },
  { at = "cont", stations = ["dpg", "ddpg", "td3", "sac"] },
]
n = [
