# The unified view (after Sutton & Barto, Figure 8.11): where each tabular method sits.
# [width, depth]: width 0 = sample updates, 1 = expected updates; depth 0 = one step (bootstrapping), 1 = the full return.
# Methods that share a corner are stacked a little apart so their names stay readable.
[unified]
td0 = [0.03, 0.04]
sarsa = [0.03, 0.09]
