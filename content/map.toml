]
blend = [
  { at = "free", stations = ["lambda-return", "td-lambda", "sarsa-lambda"] },
  { at = "pg", stations = ["gae", "trpo", "ppo"] },
]
full = [
  { at = "free", stations = ["mc-prediction", "exploring-starts", "mc-control", "off-policy-mc", "importance-sampling"] },
